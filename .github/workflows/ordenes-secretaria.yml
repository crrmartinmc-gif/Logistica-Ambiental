name: Validar órdenes y viajes vinculados de Secretaría F5B2
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ordenes-secretaria.js'
      - 'ordenes-secretaria.css'
      - 'tests/test-ordenes-secretaria.js'
      - 'tests/test-viajes-vinculados-f5b2.js'
      - 'viajes-locales.js'
      - 'service-worker.js'
      - '.github/workflows/ordenes-secretaria.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --check ordenes-secretaria.js
          node --check tests/test-ordenes-secretaria.js
          node --check tests/test-viajes-vinculados-f5b2.js
          node --check viajes-locales.js
          node --check service-worker.js
      - name: Verificar integración sin modificar circuito de viajes
        run: node tests/test-ordenes-secretaria.js
      - name: Validar cola, vínculo, fotos y kilometraje
        run: node tests/test-viajes-vinculados-f5b2.js
