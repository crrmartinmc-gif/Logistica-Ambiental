name: Validar órdenes de Secretaría F5B
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ordenes-secretaria.js'
      - 'ordenes-secretaria.css'
      - 'tests/test-ordenes-secretaria.js'
      - '.github/workflows/ordenes-secretaria.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --check ordenes-secretaria.js
          node --check tests/test-ordenes-secretaria.js
      - name: Verificar integración sin modificar circuito de viajes
        run: node tests/test-ordenes-secretaria.js
